<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frbonplan — Admin</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0b0b0f;
  color:#fff;
}
.container{
  max-width:900px;
  margin:auto;
  padding:30px 18px 60px;
}
h1{margin-bottom:5px}
.subtitle{color:#999;margin-bottom:30px}
.card{
  background:#15151c;
  border:1px solid #292934;
  border-radius:18px;
  padding:22px;
  margin-bottom:20px;
}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}
label{
  display:block;
  font-size:13px;
  color:#aaa;
  margin-bottom:7px;
}
input,textarea,select{
  width:100%;
  background:#0d0d12;
  color:#fff;
  border:1px solid #30303b;
  border-radius:10px;
  padding:12px;
  outline:none;
}
textarea{min-height:100px;resize:vertical}
input:focus,textarea:focus,select:focus{
  border-color:#ff315d;
}
.full{grid-column:1/-1}
button{
  border:0;
  border-radius:12px;
  padding:13px 18px;
  cursor:pointer;
  font-weight:700;
}
.primary{
  background:linear-gradient(135deg,#ff315d,#ff6b35);
  color:#fff;
  width:100%;
  margin-top:18px;
}
.secondary{
  background:#252530;
  color:#fff;
}
.status{
  margin-top:15px;
  padding:12px;
  border-radius:10px;
  display:none;
}
.success{background:#123d27;color:#62f39b}
.error{background:#40151d;color:#ff8294}
.product{
  display:flex;
  gap:15px;
  align-items:center;
  border-top:1px solid #292934;
  padding:15px 0;
}
.product img{
  width:70px;
  height:70px;
  object-fit:cover;
  border-radius:12px;
}
.product-info{flex:1}
.product-name{font-weight:700}
.product-price{color:#ff5275;margin-top:5px}
.small{
  color:#888;
  font-size:12px;
}
@media(max-width:650px){
  .grid{grid-template-columns:1fr}
  .full{grid-column:auto}
  .product{align-items:flex-start}
}
</style>
</head>

<body>

<div class="container">

  <h1>⚡ Frbonplan Admin</h1>
  <div class="subtitle">
    Gestion de tes bons plans Hacoo
  </div>

  <div class="card">

    <h2>Ajouter un bon plan</h2>

    <div class="grid">

      <div class="full">
        <label>Nom du produit</label>
        <input id="name" placeholder="Ex : Sneakers tendance">
      </div>

      <div>
        <label>Prix normal</label>
        <input id="oldPrice" type="number" step="0.01" placeholder="49.90">
      </div>

      <div>
        <label>Prix promotionnel</label>
        <input id="price" type="number" step="0.01" placeholder="39.90">
      </div>

      <div>
        <label>Code promo</label>
        <input id="code" placeholder="FRBONPLAN">
      </div>

      <div>
        <label>Catégorie</label>
        <select id="category">
          <option value="mode">Mode</option>
          <option value="sneakers">Sneakers</option>
          <option value="accessoires">Accessoires</option>
          <option value="electronique">Électronique</option>
          <option value="maison">Maison</option>
          <option value="autre">Autre</option>
        </select>
      </div>

      <div class="full">
        <label>Lien Hacoo</label>
        <input id="url" type="url" placeholder="https://...">
      </div>

      <div class="full">
        <label>URL de l'image</label>
        <input id="image" type="url" placeholder="https://...">
      </div>

      <div class="full">
        <label>Description</label>
        <textarea id="description" placeholder="Description du produit..."></textarea>
      </div>

    </div>

    <button class="primary" onclick="addProduct()">
      🚀 Ajouter le produit
    </button>

    <div id="status" class="status"></div>

  </div>

  <div class="card">

    <h2>Produits publiés</h2>

    <div id="products">
      Chargement...
    </div>

  </div>

</div>

<script>

const REPO = "Frbonplan/Frbonplan";
const FILE = "products.json";

let products = [];
let fileSha = null;

/*
  Pour l'instant, le token n'est pas enregistré.
  Il reste uniquement dans cette page.
*/
let githubToken = sessionStorage.getItem("frbonplan_admin_token");

async function askToken(){

  if(githubToken) return true;

  githubToken = prompt(
    "Entre ton token GitHub pour gérer les produits.\n\n" +
    "Il restera uniquement dans cette session."
  );

  if(!githubToken){
    showStatus("Token GitHub requis.", true);
    return false;
  }

  sessionStorage.setItem(
    "frbonplan_admin_token",
    githubToken
  );

  return true;
}

async function loadProducts(){

  try{

    const response = await fetch(
      `https://api.github.com/repos/${REPO}/contents/${FILE}`
    );

    if(response.status === 404){

      products = [];
      fileSha = null;
      renderProducts();
      return;
    }

    if(!response.ok){
      throw new Error("Impossible de lire products.json");
    }

    const data = await response.json();

    fileSha = data.sha;

    const decoded = decodeURIComponent(
      escape(
        atob(data.content.replace(/\n/g,""))
      )
    );

    products = JSON.parse(decoded);

    renderProducts();

  }catch(error){

    console.error(error);

    showStatus(
      "Impossible de charger les produits.",
      true
    );
  }
}

function renderProducts(){

  const container =
    document.getElementById("products");

  if(!products.length){

    container.innerHTML =
      `<p class="small">
        Aucun produit pour le moment.
      </p>`;

    return;
  }

  container.innerHTML = products.map(product => `

    <div class="product">

      ${
        product.image
        ? `<img src="${escapeHtml(product.image)}">`
        : ""
      }

      <div class="product-info">

        <div class="product-name">
          ${escapeHtml(product.name)}
        </div>

        <div class="product-price">
          ${product.price} €
          ${
            product.oldPrice
            ? `<span class="small">
                · ${product.oldPrice} € avant
              </span>`
            : ""
          }
        </div>

        <div class="small">
          ${escapeHtml(product.category || "")}
        </div>

      </div>

      <button
        class="secondary"
        onclick="deleteProduct('${product.id}')">
        Supprimer
      </button>

    </div>

  `).join("");
}

async function addProduct(){

  if(!(await askToken())) return;

  const name =
    document.getElementById("name").value.trim();

  const oldPrice =
    document.getElementById("oldPrice").value;

  const price =
    document.getElementById("price").value;

  const code =
    document.getElementById("code").value.trim();

  const category =
    document.getElementById("category").value;

  const url =
    document.getElementById("url").value.trim();

  const image =
    document.getElementById("image").value.trim();

  const description =
    document.getElementById("description").value.trim();

  if(!name || !price || !url){

    showStatus(
      "Remplis au minimum le nom, le prix et le lien Hacoo.",
      true
    );

    return;
  }

  const product = {

    id:
      Date.now().toString(),

    name,

    oldPrice:
      oldPrice ? Number(oldPrice) : null,

    price:
      Number(price),

    code,

    category,

    url,

    image,

    description,

    status:
      "published",

    createdAt:
      new Date().toISOString()

  };

  products.unshift(product);

  await saveProducts();

}

async function deleteProduct(id){

  if(!confirm("Supprimer ce produit ?")) return;

  if(!(await askToken())) return;

  products =
    products.filter(product =>
      product.id !== id
    );

  await saveProducts();

}

async function saveProducts(){

  try{

    showStatus(
      "Publication en cours...",
      false
    );

    const content =
      JSON.stringify(products,null,2);

    const encoded =
      btoa(
        unescape(
          encodeURIComponent(content)
        )
      );

    const body = {

      message:
        "Mise à jour des produits Frbonplan",

      content:
        encoded,

      branch:
        "main"

    };

    if(fileSha){
      body.sha = fileSha;
    }

    const response =
      await fetch(
        `https://api.github.com/repos/${REPO}/contents/${FILE}`,
        {
          method:"PUT",

          headers:{
            "Authorization":
              `Bearer ${githubToken}`,

            "Accept":
              "application/vnd.github+json",

            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify(body)
        }
      );

    const data =
      await response.json();

    if(!response.ok){

      console.error(data);

      throw new Error(
        data.message ||
        "Erreur GitHub"
      );

    }

    fileSha =
      data.content.sha;

    showStatus(
      "✅ Produit publié !",
      false
    );

    clearForm();

    renderProducts();

  }catch(error){

    console.error(error);

    showStatus(
      "❌ Erreur : " + error.message,
      true
    );

  }

}

function clearForm(){

  document
    .querySelectorAll("input, textarea")
    .forEach(element => {

      element.value = "";

    });

}

function showStatus(message,error){

  const box =
    document.getElementById("status");

  box.textContent =
    message;

  box.style.display =
    "block";

  box.className =
    "status " +
    (error ? "error" : "success");

}

function escapeHtml(value){

  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

loadProducts();

</script>

</body>
</html>
