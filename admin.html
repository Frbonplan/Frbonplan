<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Frbonplan Admin</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#09090b;
  color:#fff;
  font-family:Arial,sans-serif;
}
main{max-width:700px;margin:auto;padding:25px 16px 60px}
h1{margin-bottom:5px}
p{color:#999}
.card{
  background:#151518;
  border:1px solid #29292f;
  border-radius:18px;
  padding:20px;
  margin-top:20px;
}
label{
  display:block;
  margin:14px 0 6px;
  color:#aaa;
  font-size:14px;
}
input,textarea,select{
  width:100%;
  padding:13px;
  border-radius:10px;
  border:1px solid #333;
  background:#0d0d0f;
  color:white;
  font-size:15px;
}
textarea{min-height:100px}
button{
  width:100%;
  border:0;
  border-radius:12px;
  padding:14px;
  margin-top:18px;
  background:linear-gradient(135deg,#ff315d,#ff6b35);
  color:white;
  font-weight:bold;
  font-size:16px;
  cursor:pointer;
}
#preview{
  width:100%;
  max-height:300px;
  object-fit:contain;
  border-radius:14px;
  margin-top:12px;
  display:none;
}
.status{
  padding:12px;
  border-radius:10px;
  margin-top:15px;
  display:none;
}
.ok{background:#123b25;color:#6dffa0}
.err{background:#45151c;color:#ff8c9b}
</style>
</head>

<body>

<main>

<h1>⚡ Frbonplan Admin</h1>
<p>Ajouter un nouveau bon plan</p>

<div class="card">

<label>Nom du produit</label>
<input id="name" placeholder="Ex : Sneakers tendance">

<label>Prix avant réduction</label>
<input id="oldPrice" type="number" step="0.01" placeholder="49.90">

<label>Prix après réduction</label>
<input id="price" type="number" step="0.01" placeholder="39.90">

<label>Code promo</label>
<input id="code" placeholder="FRBONPLAN">

<label>Catégorie</label>
<select id="category">
<option>Mode</option>
<option>Sneakers</option>
<option>Électronique</option>
<option>Maison</option>
<option>Accessoires</option>
<option>Autre</option>
</select>

<label>Lien Hacoo</label>
<input id="url" type="url" placeholder="https://...">

<label>Image du produit</label>
<input id="imageFile" type="file" accept="image/*">

<img id="preview">

<label>Description</label>
<textarea id="description"
placeholder="Décris rapidement le bon plan..."></textarea>

<button onclick="publishProduct()">
🚀 PUBLIER LE BON PLAN
</button>

<div id="status" class="status"></div>

</div>

</main>

<script>

const OWNER="Frbonplan";
const REPO="Frbonplan";
const BRANCH="main";

let token=sessionStorage.getItem("frbonplan_token");

function status(text,error=false){
  const s=document.getElementById("status");
  s.textContent=text;
  s.className="status "+(error?"err":"ok");
  s.style.display="block";
}

async function getToken(){

  if(token)return token;

  token=prompt(
    "Colle ton token GitHub ici.\n\n"+
    "Il sera conservé uniquement pendant cette session."
  );

  if(!token){
    status("Token obligatoire.",true);
    return null;
  }

  sessionStorage.setItem("frbonplan_token",token);

  return token;
}

document.getElementById("imageFile").addEventListener("change",function(){

  const file=this.files[0];

  if(!file)return;

  if(!file.type.startsWith("image/")){
    status("Choisis une image.",true);
    return;
  }

  if(file.size>5*1024*1024){
    status("Image trop lourde. Maximum 5 Mo.",true);
    this.value="";
    return;
  }

  const reader=new FileReader();

  reader.onload=()=>{
    const img=document.getElementById("preview");
    img.src=reader.result;
    img.style.display="block";
  };

  reader.readAsDataURL(file);

});

async function github(path,options={}){

  const response=await fetch(
    `https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}`,
    {
      ...options,
      headers:{
        "Authorization":`Bearer ${token}`,
        "Accept":"application/vnd.github+json",
        "Content-Type":"application/json",
        ...(options.headers||{})
      }
    }
  );

  const data=await response.json();

  if(!response.ok)
    throw new Error(data.message||"Erreur GitHub");

  return data;
}

async function uploadFile(path,base64){

  let sha;

  try{
    const old=await github(path);
    sha=old.sha;
  }catch(e){}

  const body={
    message:"Ajout image produit",
    content:base64,
    branch:BRANCH
  };

  if(sha)body.sha=sha;

  return github(path,{
    method:"PUT",
    body:JSON.stringify(body)
  });
}

async function getProducts(){

  try{

    const data=await github("products.json");

    const binary=atob(
      data.content.replace(/\n/g,"")
    );

    const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));

    return {
      products:JSON.parse(
        new TextDecoder().decode(bytes)
      ),
      sha:data.sha
    };

  }catch(e){

    return {
      products:[],
      sha:null
    };

  }
}

async function publishProduct(){

  try{

    const t=await getToken();

    if(!t)return;

    const name=document.getElementById("name").value.trim();
    const oldPrice=document.getElementById("oldPrice").value;
    const price=document.getElementById("price").value;
    const code=document.getElementById("code").value.trim();
    const category=document.getElementById("category").value;
    const url=document.getElementById("url").value.trim();
    const description=document.getElementById("description").value.trim();
    const file=document.getElementById("imageFile").files[0];

    if(!name||!price||!url||!file){
      status("Remplis le nom, prix, lien et choisis une image.",true);
      return;
    }

    status("Publication en cours...");

    /* IMAGE */

    const imageData=await readFile(file);

    const extension=
      file.type==="image/png"?"png":
      file.type==="image/webp"?"webp":"jpg";

    const filename=
      Date.now()+"-"+slug(name)+"."+extension;

    const imagePath="images/produits/"+filename;

    await uploadFile(
      imagePath,
      imageData.split(",")[1]
    );

    /* PRODUIT */

    const data=await getProducts();

    const product={
      id:Date.now().toString(),
      name,
      oldPrice:oldPrice?Number(oldPrice):null,
      price:Number(price),
      code,
      category,
      url,
      image:imagePath,
      description,
      status:"published",
      createdAt:new Date().toISOString()
    };

    data.products.unshift(product);

    const json=JSON.stringify(data.products,null,2);

    const encoded=btoa(
      unescape(
        encodeURIComponent(json)
      )
    );

    const body={
      message:"Ajout bon plan",
      content:encoded,
      branch:BRANCH
    };

    if(data.sha)body.sha=data.sha;

    await github("products.json",{
      method:"PUT",
      body:JSON.stringify(body)
    });

    status("✅ Bon plan publié !");

    document.querySelectorAll("input,textarea").forEach(e=>{
      if(e.type!=="file")e.value="";
    });

    document.getElementById("preview").style.display="none";
    document.getElementById("imageFile").value="";

  }catch(error){

    console.error(error);

    status("❌ "+error.message,true);

  }

}

function readFile(file){

  return new Promise((resolve,reject)=>{

    const reader=new FileReader();

    reader.onload=()=>resolve(reader.result);
    reader.onerror=reject;

    reader.readAsDataURL(file);

  });

}

function slug(text){

  return text
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9]+/g,"-")
    .replace(/^-|-$/g,"")
    .slice(0,50);

}

</script>

</body>
</html>
